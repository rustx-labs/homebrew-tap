name: Update casks

on:
  schedule:
    # Daily at 06:00 UTC (14:00 CST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  check-and-update:
    name: Check cask versions and create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run version check script
        id: check
        shell: bash
        run: |
          bash scripts/update-casks.sh

      - name: Create Pull Request
        if: steps.check.outputs.updated != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(cask): update casks to latest versions

            ${{ steps.check.outputs.pr_body }}
          title: 'chore(cask): update casks to latest versions'
          body: |
            ## 📦 Cask Version Updates

            ${{ steps.check.outputs.pr_body }}

            ---
            _This PR was automatically generated by the scheduled cask update workflow._
          branch: auto/cask-updates
          base: main
          labels: |
            pr-pull
            automated
          add-paths: |
            Casks/
